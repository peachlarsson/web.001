<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game of Life</title>
  <style>
    :root {
      --bg: #2f2f2f;
      --panel: #1f1f1f;
      --panel-border: #3a3a3a;
      --text: #f2f2f2;
      --muted: #b8b8b8;
      --cell: #7adf9c;
      --cell-dead: rgba(255,255,255,0.08);
      --button: #3b3b3b;
      --button-hover: #4a4a4a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(92vw, 900px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(1.8rem, 2vw, 2.5rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    button {
      border: 1px solid var(--panel-border);
      background: var(--button);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    button:hover {
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    .canvas-wrap {
      display: flex;
      justify-content: center;
      overflow: auto;
      padding: 8px;
      border-radius: 12px;
      background: #242424;
      border: 1px solid var(--panel-border);
    }

    canvas {
      display: block;
      width: min(80vw, 700px);
      height: auto;
      background: #111;
      border-radius: 8px;
      border: 1px solid #2d2d2d;
    }

    .status {
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 0.96rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Game of Life</h1>

    <div class="controls">
      <button id="toggle">Start</button>
      <button id="step">Step</button>
      <button id="randomize">Randomize</button>
      <button id="clear">Clear</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="lifeCanvas" width="700" height="700"></canvas>
    </div>

    <div class="status" id="status">Paused</div>
  </div>

  <script>
    const canvas = document.getElementById('lifeCanvas');
    const ctx = canvas.getContext('2d');
    const toggleBtn = document.getElementById('toggle');
    const stepBtn = document.getElementById('step');
    const randomizeBtn = document.getElementById('randomize');
    const clearBtn = document.getElementById('clear');
    const statusEl = document.getElementById('status');

    const cols = 50;
    const rows = 50;
    const cellSize = canvas.width / cols;
    let grid = createEmptyGrid();
    let running = false;
    let animationId = null;

    function createEmptyGrid() {
      return Array.from({ length: rows }, () => Array(cols).fill(0));
    }

    function cloneGrid(source) {
      return source.map(row => [...row]);
    }

    function seedGliderGun() {
      const seed = createEmptyGrid();
      const patterns = [
        [1, 5], [2, 5], [1, 6], [2, 6],
        [11, 5], [11, 6], [11, 7], [12, 4], [13, 3], [14, 3], [12, 8], [13, 9], [14, 9], [15, 6], [16, 5], [17, 5], [17, 6], [17, 7], [16, 8], [15, 8], [15, 7],
        [21, 3], [21, 4], [21, 5], [22, 3], [22, 4], [22, 5], [23, 2], [23, 6], [25, 1], [25, 2], [25, 6], [25, 7], [35, 3], [36, 3], [35, 4], [36, 4]
      ];

      patterns.forEach(([x, y]) => {
        if (x >= 0 && x < cols && y >= 0 && y < rows) {
          seed[y][x] = 1;
        }
      });

      return seed;
    }

    function randomizeGrid() {
      grid = Array.from({ length: rows }, () =>
        Array.from({ length: cols }, () => (Math.random() < 0.24 ? 1 : 0))
      );
      draw();
    }

    function clearGrid() {
      running = false;
      toggleBtn.textContent = 'Start';
      statusEl.textContent = 'Paused';
      if (animationId) {
        cancelAnimationFrame(animationId);
      }
      grid = createEmptyGrid();
      draw();
    }

    function countNeighbors(x, y) {
      let sum = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = (x + dx + cols) % cols;
          const ny = (y + dy + rows) % rows;
          sum += grid[ny][nx];
        }
      }
      return sum;
    }

    function nextGeneration() {
      const next = createEmptyGrid();
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const alive = grid[y][x] === 1;
          const neighbors = countNeighbors(x, y);

          if (alive && (neighbors === 2 || neighbors === 3)) {
            next[y][x] = 1;
          } else if (!alive && neighbors === 3) {
            next[y][x] = 1;
          }
        }
      }
      grid = next;
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (grid[y][x]) {
            ctx.fillStyle = '#7adf9c';
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
          } else {
            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
          }
        }
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.07)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= cols; x++) {
        ctx.beginPath();
        ctx.moveTo(x * cellSize, 0);
        ctx.lineTo(x * cellSize, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= rows; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * cellSize);
        ctx.lineTo(canvas.width, y * cellSize);
        ctx.stroke();
      }
    }

    function tick() {
      if (!running) return;
      nextGeneration();
      animationId = requestAnimationFrame(tick);
    }

    function toggleRunning() {
      running = !running;
      toggleBtn.textContent = running ? 'Pause' : 'Start';
      statusEl.textContent = running ? 'Running' : 'Paused';

      if (running) {
        animationId = requestAnimationFrame(tick);
      } else {
        cancelAnimationFrame(animationId);
      }
    }

    toggleBtn.addEventListener('click', toggleRunning);
    stepBtn.addEventListener('click', () => {
      if (running) return;
      nextGeneration();
    });
    randomizeBtn.addEventListener('click', randomizeGrid);
    clearBtn.addEventListener('click', clearGrid);

    canvas.addEventListener('click', (event) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = Math.floor((event.clientX - rect.left) * scaleX / cellSize);
      const y = Math.floor((event.clientY - rect.top) * scaleY / cellSize);

      if (x >= 0 && x < cols && y >= 0 && y < rows) {
        grid[y][x] = grid[y][x] ? 0 : 1;
        draw();
      }
    });

    grid = seedGliderGun();
    draw();
  </script>
</body>
</html>
